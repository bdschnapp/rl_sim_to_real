/**:
  ros__parameters:
    # Point-cloud ROI in the LiDAR frame. Tune these to keep the green box on the
    # visible trailer front/side faces.
    roi_x_min: -4.0
    roi_x_max: -1.5
    roi_y_half: 0.9
    roi_z_min: -0.3
    roi_z_max: 2.5
    roi_max_y_shift: 1.2

    # Geometry priors matched to
    # autoware_truck_trailer_freespace_planner/config/truck_trailer_freespace_planner.param.yaml.
    tractor_base2hinge: 0.20
    trailer_front_oh: 0.39
    trailer_wheel_base: 2.75
    trailer_rear_oh: 0.51
    trailer_width: 0.62
    use_dimension_prior: true
    dimension_prior_weight: 1.0
    dimension_heading_weight: 3.0
    dimension_width_tolerance_m: 0.20
    dimension_length_margin_m: 0.50

    # Autoware output. The planner expects radians and the convention
    # hitch_angle = theta_truck - theta_trailer.
    publish_trailer_state: true
    trailer_state_topic: /vehicle/trailer_state
    # Raw lidar geometry produces (theta_trailer - theta_truck); the LTV MPC
    # (state_conversion.py:46) and truck-trailer planners expect
    # (theta_truck - theta_trailer). Flip the sign to match.
    hitch_angle_sign: -1.0
    hitch_angle_offset_deg: 0.0
    max_abs_hitch_angle_deg: 90.0
