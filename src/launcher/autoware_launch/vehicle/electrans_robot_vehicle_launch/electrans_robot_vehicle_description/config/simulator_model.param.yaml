/**:
  ros__parameters:
    simulated_frame_id: "base_link" # center of the rear axle.
    origin_frame_id: "map"
    # vehicle_model_type: "DELAY_STEER_ACC_GEARED" # options: IDEAL_STEER_VEL / IDEAL_STEER_ACC / IDEAL_STEER_ACC_GEARED / DELAY_STEER_ACC / DELAY_STEER_ACC_GEARED
    vehicle_model_type: "DELAY_STEER_ACC_GEARED_TRAILER"
    initialize_source: "INITIAL_POSE_TOPIC" #  options: ORIGIN / INITIAL_POSE_TOPIC
    timer_sampling_time_ms: 25
    add_measurement_noise: False # the Gaussian noise is added to the simulated results
    vel_lim: 50.0 # limit of velocity
    vel_rate_lim: 7.0 # limit of acceleration
    steer_lim: 1.0 # limit of steering angle
    steer_rate_lim: 5.0 # limit of steering angle change rate
    acc_time_delay: 0.1 # dead time for the acceleration input
    acc_time_constant: 0.1 # time constant of the 1st-order acceleration dynamics
    # Steering actuator dynamics tuned for the AgileX 1/8-scale rig's
    # hobby-class servo. The upstream defaults (delay 0.24 s + constant
    # 0.27 s = ~500 ms total response) are calibrated for a full-size car's
    # hydraulic steering column and dominate any closed-loop control at the
    # lab's 0.6 m/s driving speed. A fast hobby servo responds in ~50 ms
    # with no dead time; that's closer to the e2e_rl pygame training env
    # (zero lag) and unblocks the lab-trained policy from oversteering due
    # to actuator delay.
    steer_time_delay: 0.0
    steer_time_constant: 0.05
    steer_dead_band: 0.0 # dead band of the steering angle
    x_stddev: 0.0001 # x standard deviation for dummy covariance in map coordinate
    y_stddev: 0.0001 # y standard deviation for dummy covariance in map coordinate
    enable_road_slope_simulation: true # if true, slopes in the lanelet map are used to apply an extra acceleration to the ego vehicle
    # ---- Trailer geometry (single source of truth) -------------------------
    # Consumed by:
    #   - simple_planning_simulator (DELAY_STEER_ACC_GEARED_TRAILER dynamics)
    #   - autoware_trailer_state_visualizer (mesh placement + marker dims)
    # Both nodes load this file at startup; do NOT duplicate elsewhere.
    hitch_offset: 0.0          # hitch at rear axle; matches training-time trailer model
    trailer_wheelbase: 2.8     # AgileX lab trailer actual length 2.8 m (one true value)
    max_hitch_angle: 1.3963    # 80 deg
    # Visualizer-only marker dimensions (sim physics doesn't use these).
    trailer_width: 0.33
    trailer_height: 0.5
    trailer_front_overhang: 0.07
    trailer_rear_overhang: 0.17